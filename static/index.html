<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source to Story</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1b2130;--mute:#667085;--line:#e2e5eb;--accent:#2f55d4;--accent-ink:#fff;--accent-soft:#e9efff;
--ok:#16803c;--okbg:#e3f5e9;--bad:#b42318;--badbg:#fde8e6;--warn:#95620a;--warnbg:#fff2d3;--info:#1859c9;--infobg:#e5edfc;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#11141b;--panel:#1a1f29;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2a3140;--accent:#7b97ff;--accent-ink:#0d1220;--accent-soft:#1c2744;
--ok:#5fd18a;--okbg:#14301f;--bad:#ff8b7f;--badbg:#3a1a17;--warn:#f1c25b;--warnbg:#3a2d10;--info:#8fb2ff;--infobg:#1a2745;--shadow:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;gap:14px;padding:11px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{font-size:16px;margin:0;font-weight:650}
main{max-width:1160px;margin:0 auto;padding:20px 24px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mt{margin-top:16px}.mt-s{margin-top:8px}.mb{margin-bottom:16px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 13px;border-radius:8px;cursor:pointer;transition:border-color .12s,background .12s}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.good{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button:disabled{opacity:.5;cursor:default}button.small{padding:2px 9px;font-size:12px}button.link{border:0;background:none;color:var(--accent);padding:0}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}input[type=number]{width:110px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}label.f input,label.f select,label.f textarea{font-size:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mute);font-weight:550;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--line);color:var(--ink);white-space:nowrap}
.b-done,.b-approved,.b-good{background:var(--okbg);color:var(--ok)}.b-error,.b-rejected,.b-failed,.b-problem{background:var(--badbg);color:var(--bad)}
.b-running,.b-queued,.b-info,.b-busy{background:var(--infobg);color:var(--info)}.b-paused,.b-cancelled,.b-warn,.b-research,.b-action{background:var(--warnbg);color:var(--warn)}
.mute{color:var(--mute)}.small{font-size:12px}.err{color:var(--bad)}.ok{color:var(--ok)}.nowrap{white-space:nowrap}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 15px;color:var(--mute);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--accent);transition:width .5s}
.bar.big{height:12px}.bar.ev>i{background:var(--ok)}.bar.fail>i{background:var(--bad)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
/* stepper + next-step card */
ol.steps{list-style:none;display:flex;gap:6px;padding:0;margin:14px 0 12px;flex-wrap:wrap}
ol.steps li{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:13px}
ol.steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink)}
ol.steps li.done{color:var(--ink)}ol.steps li.done span{background:var(--ok);color:#fff}
ol.steps li.now{color:var(--ink);border-color:var(--accent);font-weight:600}ol.steps li.now span{background:var(--accent);color:var(--accent-ink)}
.next{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:12px;border:1px solid var(--line);border-left-width:5px;background:var(--panel);box-shadow:var(--shadow)}
.next.action{border-left-color:var(--accent)}.next.busy{border-left-color:var(--info)}.next.problem{border-left-color:var(--bad)}.next.good{border-left-color:var(--ok)}
.next .nt{font-weight:650;font-size:16px}.next .nd{max-width:760px}
/* stories */
.story{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.story:last-child{border-bottom:0}.story:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}.story.cur{background:var(--accent-soft)}
.story h3{margin:0 0 2px;font-size:15px}.score{text-align:center;min-width:70px}.score b{font-size:22px;display:block;line-height:1.1}
.drawer{position:fixed;inset:0 0 0 auto;width:min(780px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow:auto;z-index:20}
.drawer .dh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;z-index:2}
.drawer .db{padding:6px 20px 60px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:15}
.dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .scrim{z-index:0}.dlg .box{position:relative;z-index:1;width:min(560px,100%);max-height:92vh;overflow:auto}
.passage{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;white-space:pre-wrap}
h2{font-size:17px;margin:0 0 10px}h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
ul.tight{margin:4px 0;padding-left:20px}
.warnbox{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0}
.errbox{background:var(--badbg);color:var(--bad);padding:8px 12px;border-radius:8px;margin:8px 0}
.hint{background:var(--accent-soft);padding:10px 14px;border-radius:10px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:8px;max-height:220px;overflow:auto;font-size:12px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;width:min(560px,94vw)}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:in .15s}
.toast.bad{background:var(--bad);color:#fff}.toast button{background:none;border:1px solid currentColor;color:inherit;padding:1px 10px;font-size:12px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.skel{background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 40%,var(--panel)),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:18px;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}.dot.done{background:var(--ok)}.dot.running{background:var(--info);animation:pu 1s infinite}.dot.failed{background:var(--bad)}
@keyframes pu{50%{opacity:.3}}
.big-empty{text-align:center;padding:48px 20px}.big-empty h2{font-size:20px}
.dirty{color:var(--warn)}
@media (max-width:640px){main{padding:12px}.story{grid-template-columns:auto 1fr}.story .score{grid-column:2;text-align:left}}
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/" style="color:inherit">Source to Story</a></h1>
  <span class="sp"></span>
  <a href="#/settings">Settings</a>
  <button class="small" onclick="logout()">Sign out</button>
</header>
<main id="app"></main>
<div id="overlay"></div>
<div id="toasts"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = t => t ? new Date(t * 1000).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '';
const num = n => (n ?? 0).toLocaleString();
const hd = s => { s = Math.max(0, Math.round(s)); return s < 60 ? s + 's' : s < 600 ? Math.floor(s/60) + 'm ' + String(s % 60).padStart(2,'0') + 's' : s < 3600 ? Math.round(s/60) + ' min' : Math.floor(s/3600) + 'h ' + String(Math.round(s % 3600 / 60)).padStart(2,'0') + 'm'; };
const LS = {get(k, d) { try { const v = localStorage.getItem('sts:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
            set(k, v) { try { localStorage.setItem('sts:' + k, JSON.stringify(v)); } catch {} }};
let timer = null, route_id = 0;

/* ───────── plumbing ───────── */
async function api(path, opts = {}) {
  const o = {method: opts.method || 'GET', headers: {}};
  if (opts.json !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.json); }
  if (opts.form) o.body = opts.form;
  const r = await fetch('/api' + path, o);
  if (r.status === 401) { location = '/login'; throw new Error('Please sign in again.'); }
  const text = await r.text(); let data; try { data = JSON.parse(text); } catch { data = text; }
  if (!r.ok) { const e = new Error((data && data.detail) || r.statusText); e.status = r.status; throw e; }
  return data;
}
function toast(msg, o = {}) {
  const t = document.createElement('div'); t.className = 'toast' + (o.bad ? ' bad' : '');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (o.undo) { const b = document.createElement('button'); b.textContent = 'Undo'; b.onclick = async () => { t.remove(); try { await o.undo(); toast('Undone'); } catch (e) { toast(e.message, {bad: true}); } }; t.append(b); }
  $('#toasts').append(t); setTimeout(() => t.remove(), o.bad ? 9000 : o.undo ? 7000 : 3500);
}
async function act(btn, fn, ok) {                       // run an action with a busy button and a visible result
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Working…'; }
  try { const r = await fn(); if (ok && r !== undefined) toast(typeof ok === 'function' ? ok(r) : ok); return r; }
  catch (e) { toast(e.message, {bad: true}); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
function dialog({title, html = '', buttons = [{label: 'OK', value: true, primary: true}]}) {
  return new Promise(res => {
    const layer = document.createElement('div'); layer.className = 'dlg';
    layer.innerHTML = `<div class="scrim"></div><div class="box card pad"><h2>${esc(title)}</h2><div class="dlg-body">${html}</div><div id="dlg-err" class="errbox" hidden></div>
      <div class="row mt"><span class="sp"></span>${buttons.map((b, i) => `<button data-i="${i}" class="${b.primary ? 'primary' : ''} ${b.danger ? 'bad' : ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.append(layer);
    const close = v => { layer.remove(); document.removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', key, true);
    layer.querySelector('.scrim').onclick = () => close(null);
    layer.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
      const d = buttons[+b.dataset.i]; const v = d.collect ? d.collect(layer) : d.value;
      const bad = d.validate && d.validate(v, layer); if (bad) { const e = layer.querySelector('#dlg-err'); e.textContent = bad; e.hidden = false; return; }
      close(v);
    });
    const first = layer.querySelector('input,textarea,select'); if (first) first.focus();
  });
}
const confirmDlg = (title, message, label = 'Confirm', danger = false) =>
  dialog({title, html: `<p>${message}</p>`, buttons: [{label: 'Cancel', value: false}, {label, value: true, primary: !danger, danger}]}).then(v => v === true);
const textDlg = (title, label, value = '', multiline = false) =>
  dialog({title, html: `<label class="f">${esc(label)}${multiline ? `<textarea id="td" style="min-height:160px">${esc(value)}</textarea>` : `<input id="td" value="${esc(value)}">`}</label>`,
    buttons: [{label: 'Cancel', value: null}, {label: 'Save', primary: true, collect: l => l.querySelector('#td').value}]});
async function logout() { await fetch('/logout', {method: 'POST'}); location = '/login'; }
const badge = (s, label) => `<span class="badge b-${esc(s)}">${esc(label ?? s)}</span>`;
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`;
const closeOverlay = () => { $('#overlay').innerHTML = ''; document.removeEventListener('keydown', drawerKeys); storyOpen = null; setQuery({s: null}); };
function setQuery(obj) {                                // update ?key=val in the hash without re-rendering
  const [path, qs = ''] = location.hash.slice(1).split('?'); const q = new URLSearchParams(qs);
  for (const [k, v] of Object.entries(obj)) v == null || v === '' ? q.delete(k) : q.set(k, v);
  history.replaceState(null, '', '#' + path + (q.toString() ? '?' + q : ''));
}
const hashQuery = () => new URLSearchParams(location.hash.split('?')[1] || '');

/* ───────── router ───────── */
function route() {
  clearTimeout(timer); timer = null; route_id++; $('#overlay').innerHTML = ''; storyOpen = null;
  document.removeEventListener('keydown', drawerKeys);
  const h = (location.hash.slice(1) || '/').split('?')[0]; let m;
  if (h === '/settings') return viewSettings();
  if ((m = h.match(/^\/p\/([0-9a-f]+)(?:\/(\w+))?$/))) return viewProject(m[1], m[2] || 'progress');
  return viewDashboard();
}
addEventListener('hashchange', route);

/* ───────── dashboard ───────── */
const dash = Object.assign({q: '', status: '', format: '', sort: 'created', desc: true}, LS.get('dash', {}));
function nextHint(p) {
  if (p.status === 'imported') return ['Choose scope and start', 'action'];
  if (['queued', 'running'].includes(p.status)) return ['Processing' + (p.stage ? ': ' + p.stage : ''), 'busy'];
  if (['paused', 'cancelled'].includes(p.status)) return ['Resume processing', 'action'];
  if (p.status === 'error') return ['Needs attention', 'problem'];
  if (!p.cand_total) return ['No stories found', 'problem'];
  if (p.cand_pending) return [`${p.cand_pending} to review`, 'action'];
  return p.cand_approved ? ['Ready to export', 'good'] : ['All rejected', 'problem'];
}
async function viewDashboard() {
  const my = route_id;
  $('#app').innerHTML = `
    <div class="row"><h2 style="margin:0">Projects</h2><span class="sp"></span><button class="primary" onclick="importDialog()">+ Import a source</button></div>
    <div class="row mt-s">
      <input id="dq" placeholder="Search title, author or URL" value="${esc(dash.q)}" style="flex:1;min-width:200px">
      <select id="ds"><option value="">Any status</option>${['imported', 'queued', 'running', 'paused', 'cancelled', 'error', 'done'].map(s => `<option ${dash.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <select id="df"><option value="">Any format</option>${['pdf', 'article', 'text'].map(s => `<option ${dash.format === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <select id="dso">${[['created', 'Import date'], ['updated', 'Last activity'], ['title', 'Title'], ['status', 'Status'], ['candidates', 'Stories'], ['tokens', 'Size']].map(([v, l]) => `<option value="${v}" ${dash.sort === v ? 'selected' : ''}>Sort: ${l}</option>`).join('')}</select>
      <button id="dd" title="Reverse order">${dash.desc ? '↓' : '↑'}</button>
    </div>
    <div class="card mt" id="plist"><div class="pad"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>`;
  const reload = () => { LS.set('dash', dash); loadProjects().catch(e => toast(e.message, {bad: true})); };
  $('#dq').oninput = e => { dash.q = e.target.value; clearTimeout(dash.t); dash.t = setTimeout(reload, 250); };
  $('#ds').onchange = e => { dash.status = e.target.value; reload(); };
  $('#df').onchange = e => { dash.format = e.target.value; reload(); };
  $('#dso').onchange = e => { dash.sort = e.target.value; reload(); };
  $('#dd').onclick = e => { dash.desc = !dash.desc; e.target.textContent = dash.desc ? '↓' : '↑'; reload(); };
  await loadProjects();
  const tick = () => { if (my !== route_id) return; loadProjects().catch(() => {}); timer = setTimeout(tick, 4000); }; timer = setTimeout(tick, 4000);
}
async function loadProjects() {
  const ps = await api('/projects?' + new URLSearchParams({q: dash.q, status: dash.status, format: dash.format, sort: dash.sort, desc: dash.desc}));
  const el = $('#plist'); if (!el) return;
  if (!ps.length) {
    el.innerHTML = dash.q || dash.status || dash.format ? `<div class="big-empty mute">No projects match these filters.</div>` : `<div class="big-empty"><h2>Start with a source</h2>
      <p class="mute" style="max-width:520px;margin:0 auto 16px">Import a PDF book, an article link, or pasted text. The app reads it, finds the individual stories inside, links each one to the exact pages that support it, and lets you review them.</p>
      <button class="primary" onclick="importDialog()">+ Import a source</button>
      <ol class="mute small" style="display:inline-block;text-align:left;margin-top:20px"><li>Import</li><li>Choose what to process, then start (takes a while for a book)</li><li>Review the stories it found</li><li>Export the approved ones</li></ol></div>`;
    return;
  }
  el.innerHTML = `<table><thead><tr><th>Source</th><th>Format</th><th>Imported</th><th>Size</th><th>Status</th><th>Stories</th><th>Next</th></tr></thead><tbody>${ps.map(p => { const [h, tone] = nextHint(p); return `
    <tr class="click" onclick="location.hash='#/p/${p.id}'">
      <td><b>${esc(p.title)}</b><div class="mute small">${esc(p.author || p.source_url || '')}</div></td>
      <td>${badge('info', p.format)}</td><td class="small">${fmtDate(p.created_at)}</td>
      <td class="small">${p.page_count ? p.page_count + ' pages<br>' : ''}~${num(p.est_tokens)} tokens<br>${p.chapter_count} chapter${p.chapter_count === 1 ? '' : 's'}</td>
      <td>${badge(p.status, p.status === 'imported' ? 'ready' : p.status)}${p.error ? `<div class="err small">${esc(p.error.slice(0, 80))}</div>` : ''}</td>
      <td class="small"><b>${p.cand_total}</b> found<br><span class="ok">${p.cand_approved} ✓</span> · <span class="err">${p.cand_rejected} ✗</span> · ${p.cand_pending} open</td>
      <td>${badge(tone, h)}</td></tr>`; }).join('')}</tbody></table>`;
}

/* ───────── import ───────── */
async function importDialog() {
  let mode = 'file';
  const body = () => mode === 'file' ? `<label class="f">PDF, TXT, MD or HTML file<input type="file" id="i-file" accept=".pdf,.txt,.md,.html,.htm"></label>`
    : mode === 'url' ? `<label class="f">Public article or PDF link<input id="i-url" placeholder="https://…"></label><p class="mute small">Some sites block automated downloads. If this fails, open the page, copy the text and use "Paste text".</p>`
    : `<label class="f">Text<textarea id="i-text" style="min-height:150px" placeholder="Paste the article or chapter text here"></textarea></label>`;
  const layer = document.createElement('div'); layer.className = 'dlg';
  layer.innerHTML = `<div class="scrim"></div><div class="box card pad"><h2>Import a source</h2>
    <div class="tabs" style="margin-top:0"><button class="on" data-t="file">File</button><button data-t="url">Web link</button><button data-t="text">Paste text</button></div>
    <div id="imp-body">${body()}</div>
    <div class="grid g2 mt-s"><label class="f">Title (optional)<input id="i-title"></label><label class="f">Author or source (optional)<input id="i-author"></label></div>
    <p class="mute small">Use material you are allowed to use: public domain, openly licensed, or your own. Paywalls and DRM are never bypassed.</p>
    <div id="imp-err" class="errbox" hidden></div>
    <div class="row"><span class="sp"></span><button id="imp-x">Cancel</button><button class="primary" id="imp-go">Import</button></div></div>`;
  document.body.append(layer);
  const close = () => layer.remove();
  layer.querySelector('.scrim').onclick = close; layer.querySelector('#imp-x').onclick = close;

const ul = a => (a || []).length ? `<ul class="tight">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="mute">none</span>';

async function closeStory() { if (dirty && !await confirmDlg('Close without saving?', 'You have unsaved edits on this story.', 'Close without saving', true)) return; dirty = false; closeOverlay(); loadStories(); }

async function saveStory(btn, quiet) {

    score_override: $('#e-sov').value === '' ? null : +$('#e-sov').value, priority_override: $('#e-pov').value === '' ? null : +$('#e-pov').value};

  return act(btn, async () => { S = await api('/stories/' + S.id, {method: 'PATCH', json: patch}); dirty = false; const f = $('#dirtyflag'); if (f) f.innerHTML = '<span class="ok">✓ saved</span>'; return S; }, quiet ? null : 'Changes saved');

    <div class="card pad mt"><h4 style="margin-top:0">Stories &amp; scoring</h4>
      <div class="grid g3">${n('max_candidates', 'Stories to write up per source', 1, 'Further leads stay listed.')}${n('evidence_influence', 'Evidence influence (0–1)', 0.05, '0 ignores evidence in priority; 1 scales fully.')}</div>
      <div class="grid g3 mt-s">${Object.entries(s.weights).map(([k, v]) => `<label class="f">Weight: ${esc(k)}<input type="number" data-w="${k}" value="${v}"></label>`).join('')}</div>
      <label class="small mt-s" style="display:block"><input type="checkbox" data-s="ocr" ${s.ocr ? 'checked' : ''}> Try OCR on scanned PDF pages (needs Tesseract installed)</label></div>
    <div class="row mt"><button class="primary" onclick="saveSettings(this)">Save settings</button><span class="mute small">After changing scoring weights, use “Re-score” on a project's Stories tab.</span></div>
    <div class="card pad mt"><h4 style="margin-top:0">Speed history (used for time estimates)</h4>
      ${perf.length ? `<table><thead><tr><th>Model</th><th>Stage</th><th>Calls</th><th>Avg time</th><th>Output speed</th><th>Tokens in / out</th></tr></thead><tbody>${perf.map(p => `<tr><td class="small">${esc(p.model)}</td><td>${esc(p.stage)}</td><td>${p.calls}</td><td>${hd(p.avg_s)}</td><td>${p.out_tok_s} tok/s</td><td class="small">${num(p.tokens_in)} / ${num(p.tokens_out)}</td></tr>`).join('')}</tbody></table>
      <p class="mute small mt-s">Every finished step adds to this, so estimates get better with use.</p>` : '<p class="mute">No steps recorded yet. Estimates use typical speeds until you have run something.</p>'}</div>`;
  showDerived(s);
}
function showDerived(s) { const d = s.derived; $('#derived').innerHTML = `Usable window: <b>${num(d.usable_tokens)}</b> tokens · input room per request before instructions: <b>${num(d.input_limit)}</b> · effective chunk size: <b>${num(d.effective_chunk_tokens)}</b>${d.warnings.map(w => `<div style="color:var(--warn)">⚠ ${esc(w)}</div>`).join('')}`; }
async function saveSettings(btn) {
  const patch = {};
  document.querySelectorAll('[data-s]').forEach(el => { patch[el.dataset.s] = el.type === 'checkbox' ? el.checked : el.value; });
  patch.weights = {}; document.querySelectorAll('[data-w]').forEach(el => patch.weights[el.dataset.w] = +el.value);
  const k = $('#s-key').value; if (k) patch.api_key = k;
  return act(btn, async () => { const s = await api('/settings', {method: 'PUT', json: patch}); showDerived(s); $('#s-key').value = ''; return s; }, 'Settings saved');
}
async function testConn(btn) {
  if (!await saveSettings(null)) return; $('#conn').innerHTML = '<span class="mute"><span class="spin"></span> Testing… (a first reply can take a minute while the model loads)</span>'; btn.disabled = true;
  try {
    const r = await api('/llm/test', {method: 'POST'});
    $('#conn').innerHTML = r.ok ? `<div class="ok">✓ Connected to ${esc(r.model)} (replied in ${r.latency_s}s). ${r.model_listed === false ? '<span style="color:var(--warn)">The model id is not in the server model list.</span>' : ''}
      ${r.note ? `<div class="small mute">${esc(r.note)}</div>` : ''}</div>` : `<div class="errbox">Could not connect: ${esc(r.error || 'unknown error')}<div class="small">Check the base URL and key, and that the model server is running.</div></div>`;
    if (r.models) $('#models').innerHTML = r.models.filter(m => m.type === 'text' || !m.type).map(m => `<option value="${esc(m.id)}">${esc(m.state)}</option>`).join('');
  } catch (e) { $('#conn').innerHTML = `<div class="errbox">${esc(e.message)}</div>`; } finally { btn.disabled = false; }
}
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
route();
</script>
</body>
</html>
