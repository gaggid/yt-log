<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source to Story</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2230;--mute:#667085;--line:#e3e6ec;--accent:#3157d5;--accent-ink:#fff;
--ok:#17803d;--okbg:#e4f6ea;--bad:#b42318;--badbg:#fde9e7;--warn:#9a6700;--warnbg:#fff3d6;--info:#175cd3;--infobg:#e6eefc;--shadow:0 1px 2px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f29;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2a3140;--accent:#7b97ff;--accent-ink:#0d1220;
--ok:#5fd18a;--okbg:#14301f;--bad:#ff8b7f;--badbg:#3a1a17;--warn:#f1c25b;--warnbg:#3a2d10;--info:#8fb2ff;--infobg:#1a2745;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{font-size:16px;margin:0;font-weight:650}header.top .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mt{margin-top:16px}.mt-s{margin-top:8px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:default}button.small{padding:2px 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}input[type=number]{width:110px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}label.f input,label.f select,label.f textarea{font-size:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mute);font-weight:550;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--line);color:var(--ink);white-space:nowrap}
.b-done,.b-approved{background:var(--okbg);color:var(--ok)}.b-error,.b-rejected,.b-failed{background:var(--badbg);color:var(--bad)}
.b-running,.b-queued{background:var(--infobg);color:var(--info)}.b-paused,.b-cancelled,.b-warn,.b-research{background:var(--warnbg);color:var(--warn)}
.mute{color:var(--mute)}.small{font-size:12px}.err{color:var(--bad)}.ok{color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:90px}.bar>i{display:block;height:100%;background:var(--accent)}
.bar.ev>i{background:var(--ok)}.bar.fail>i{background:var(--bad)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.story{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.story:last-child{border-bottom:0}.story:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.story h3{margin:0 0 2px;font-size:15px}.score{text-align:center;min-width:64px}.score b{font-size:22px;display:block;line-height:1.1}
.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow:auto;z-index:20;padding:20px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal>.card{width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.passage{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 7px 7px 0;white-space:pre-wrap}
.passage mark{background:var(--warnbg);color:inherit}
h2{font-size:17px;margin:0 0 10px}h4{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
ul.tight{margin:4px 0;padding-left:20px}.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
.warnbox{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0}
.errbox{background:var(--badbg);color:var(--bad);padding:8px 12px;border-radius:8px;margin:8px 0}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:7px;max-height:220px;overflow:auto;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:50}
@media (max-width:640px){main{padding:12px}.story{grid-template-columns:auto 1fr}.story .score{grid-column:2;text-align:left}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/" style="color:inherit">Source to Story</a></h1>
  <span class="mute small">turn books and articles into evidence-linked story candidates</span>
  <span class="sp"></span>
  <a href="#/settings">Settings</a>
  <button class="small" onclick="logout()">Sign out</button>
</header>
<main id="app"></main>
<div id="overlay"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = t => t ? new Date(t * 1000).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '';
const num = n => (n ?? 0).toLocaleString();
const dur = s => s >= 3600 ? (s/3600).toFixed(1)+' h' : s >= 60 ? Math.round(s/60)+' min' : Math.round(s)+' s';
let poll = null;

async function api(path, opts = {}) {
  const o = {method: opts.method || 'GET', headers: {}};
  if (opts.json !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.json); }
  if (opts.form) o.body = opts.form;
  const r = await fetch('/api' + path, o);
  if (r.status === 401) { location = '/login'; throw new Error('login required'); }
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = text; }
  if (!r.ok) throw new Error((data && data.detail) || r.statusText);
  return data;
}
function toast(msg, bad) { const t = document.createElement('div'); t.className = 'toast'; if (bad) t.style.background = 'var(--bad)'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), bad ? 6000 : 2500); }
const guard = fn => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };
async function logout() { await fetch('/logout', {method:'POST'}); location = '/login'; }
function badge(s, label) { return `<span class="badge b-${esc(s)}">${esc(label ?? s)}</span>`; }
function bar(p, cls = '') { return `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`; }
function closeOverlay() { $('#overlay').innerHTML = ''; }

/* ───────── router ───────── */
function route() {
  clearInterval(poll); poll = null; closeOverlay();
  const h = location.hash.slice(1) || '/';
  let m;
  if (h === '/settings') return viewSettings();
  if ((m = h.match(/^\/p\/([0-9a-f]+)(?:\/(\w+))?$/))) return viewProject(m[1], m[2] || 'progress');
  return viewDashboard();
}
addEventListener('hashchange', route);

/* ───────── dashboard ───────── */
const dash = {q: '', status: '', format: '', sort: 'created', desc: true};
async function viewDashboard() {
  $('#app').innerHTML = `
    <div class="row"><h2 style="margin:0">Projects</h2><span class="sp"></span><button class="primary" onclick="importDialog()">+ Import source</button></div>
    <div class="row mt-s">
      <input id="dq" placeholder="Search title, author, URL" value="${esc(dash.q)}" style="flex:1;min-width:200px">
      <select id="ds"><option value="">Any status</option>${['imported','queued','running','paused','cancelled','error','done'].map(s => `<option ${dash.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="df"><option value="">Any format</option>${['pdf','article','text'].map(s => `<option ${dash.format===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="dso">${[['created','Import date'],['updated','Last activity'],['title','Title'],['status','Status'],['candidates','Stories'],['tokens','Size']].map(([v,l]) => `<option value="${v}" ${dash.sort===v?'selected':''}>Sort: ${l}</option>`).join('')}</select>
      <button id="dd" title="Reverse order">${dash.desc ? '↓' : '↑'}</button>
    </div>
    <div class="card mt" id="plist"><div class="pad mute">Loading…</div></div>`;
  const reload = guard(loadProjects);
  $('#dq').oninput = e => { dash.q = e.target.value; clearTimeout(dash.t); dash.t = setTimeout(reload, 250); };
  $('#ds').onchange = e => { dash.status = e.target.value; reload(); };
  $('#df').onchange = e => { dash.format = e.target.value; reload(); };
  $('#dso').onchange = e => { dash.sort = e.target.value; reload(); };
  $('#dd').onclick = e => { dash.desc = !dash.desc; e.target.textContent = dash.desc ? '↓' : '↑'; reload(); };
  await reload();
  poll = setInterval(() => { if (location.hash.slice(1) in {'':1,'/':1}) loadProjects().catch(() => {}); }, 4000);
}
async function loadProjects() {
  const qs = new URLSearchParams({q: dash.q, status: dash.status, format: dash.format, sort: dash.sort, desc: dash.desc});
  const ps = await api('/projects?' + qs);
  const el = $('#plist'); if (!el) return;
  if (!ps.length) { el.innerHTML = `<div class="pad mute">No projects${dash.q || dash.status || dash.format ? ' match these filters' : ' yet. Import a PDF book, an article URL, or paste text to begin'}.</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>Source</th><th>Format</th><th>Imported</th><th>Size</th><th>Status</th><th>Stories</th></tr></thead><tbody>${ps.map(p => `
    <tr class="click" onclick="location.hash='#/p/${p.id}'">
      <td><b>${esc(p.title)}</b><div class="mute small">${esc(p.author || p.source_url || '')}</div>${p.warnings.length ? `<div class="small" style="color:var(--warn)">⚠ ${p.warnings.length} extraction warning${p.warnings.length>1?'s':''}</div>` : ''}</td>
      <td>${badge('info', p.format)}</td>
      <td class="small">${fmtDate(p.created_at)}</td>
      <td class="small">${p.page_count ? p.page_count + ' pages<br>' : ''}~${num(p.est_tokens)} tokens<br>${p.chapter_count} chapter${p.chapter_count===1?'':'s'}</td>
      <td>${badge(p.status, p.status === 'imported' ? 'ready' : p.status)}${p.stage && p.status !== 'done' ? `<div class="mute small">${esc(p.stage)}</div>` : ''}${p.error ? `<div class="err small">${esc(p.error.slice(0,90))}</div>` : ''}</td>
      <td class="small"><b>${p.cand_total}</b> found<br><span class="ok">${p.cand_approved} approved</span> · <span class="err">${p.cand_rejected} rejected</span> · ${p.cand_pending} to review</td>
    </tr>`).join('')}</tbody></table>`;
}

/* ───────── import ───────── */
function importDialog() {
  $('#overlay').innerHTML = `<div class="scrim" onclick="closeOverlay()"></div><div class="modal"><div class="card">
    <h2>Import a source</h2>
    <div class="tabs" style="margin-top:0"><button class="on" data-t="file">File</button><button data-t="url">Article URL</button><button data-t="text">Paste text</button></div>
    <div id="imp-body"></div>
    <div class="grid g2 mt-s"><label class="f">Title (optional)<input id="i-title"></label><label class="f">Author / source (optional)<input id="i-author"></label></div>
    <p class="mute small">Only use material you are allowed to use: public-domain, openly licensed, or your own. Paywalls and DRM are not bypassed.</p>
    <div id="imp-err" class="errbox" hidden></div>
    <div class="row mt-s"><span class="sp"></span><button onclick="closeOverlay()">Cancel</button><button class="primary" id="imp-go">Import</button></div>
  </div></div>`;
  let mode = 'file';
  const body = () => {
    $('#imp-body').innerHTML = mode === 'file' ? `<label class="f">PDF, TXT, MD or HTML file<input type="file" id="i-file" accept=".pdf,.txt,.md,.html,.htm"></label>`
      : mode === 'url' ? `<label class="f">Public article or PDF URL<input id="i-url" placeholder="https://…"></label>`
      : `<label class="f">Text<textarea id="i-text" style="min-height:150px" placeholder="Paste the article or chapter text"></textarea></label>`;
  };
  body();
  document.querySelectorAll('.modal .tabs button').forEach(b => b.onclick = () => { mode = b.dataset.t; document.querySelectorAll('.modal .tabs button').forEach(x => x.classList.toggle('on', x === b)); body(); });
  $('#imp-go').onclick = async () => {
    const btn = $('#imp-go'); btn.disabled = true; btn.textContent = 'Importing…'; $('#imp-err').hidden = true;
    try {
      const title = $('#i-title').value, author = $('#i-author').value; let p;
      if (mode === 'file') {
        const f = $('#i-file').files[0]; if (!f) throw new Error('Choose a file first.');
        const fd = new FormData(); fd.append('file', f); fd.append('title', title); fd.append('author', author);
        p = await api('/projects/upload', {method: 'POST', form: fd});
      } else if (mode === 'url') p = await api('/projects/url', {method: 'POST', json: {url: $('#i-url').value, title, author}});
      else p = await api('/projects/text', {method: 'POST', json: {text: $('#i-text').value, title, author}});
      closeOverlay(); location.hash = '#/p/' + p.id;
    } catch (e) { $('#imp-err').textContent = e.message; $('#imp-err').hidden = false; btn.disabled = false; btn.textContent = 'Import'; }
  };
}

/* ───────── project ───────── */
let P = null;
async function viewProject(id, tab) {
  try { P = await api('/projects/' + id); } catch (e) { $('#app').innerHTML = `<div class="errbox">${esc(e.message)}</div><a href="#/">Back</a>`; return; }
  const tabs = [['progress','Progress'],['stories',`Stories (${P.cand_total})`],['source','Source'],['structure','Structure']];
  $('#app').innerHTML = `
    <div class="mute small"><a href="#/">Projects</a> /</div>
    <div class="row"><h2 style="margin:0">${esc(P.title)}</h2><button class="small" onclick="editMeta()">Edit</button><span class="sp"></span><span id="pstatus"></span></div>
    <div class="mute">${esc(P.author || '')}${P.source_url ? ` · <a href="${esc(P.source_url)}" target="_blank" rel="noopener">${esc(P.source_url.slice(0,70))}</a>` : ''}</div>
    <div class="mute small">${badge('info', P.format)} imported ${fmtDate(P.created_at)} · ${P.page_count ? P.page_count + ' pages · ' : ''}~${num(P.est_tokens)} tokens · ${P.chapter_count} chapters · <a href="/api/projects/${id}/original">original file</a></div>
    ${P.warnings.map(w => `<div class="warnbox">⚠ ${esc(w)}</div>`).join('')}
    <div class="tabs">${tabs.map(([k,l]) => `<button class="${k===tab?'on':''}" onclick="location.hash='#/p/${id}/${k}'">${l}</button>`).join('')}</div>
    <div id="tab"></div>`;
  ({progress: tabProgress, stories: tabStories, source: tabSource, structure: tabStructure}[tab] || tabProgress)(id);
}
const editMeta = guard(async () => {
  const t = prompt('Title', P.title); if (t === null) return;
  const a = prompt('Author / source', P.author || ''); if (a === null) return;
  await api('/projects/' + P.id, {method: 'PATCH', json: {title: t, author: a}}); route();
});

/* progress tab */
async function tabProgress(id) {
  $('#tab').innerHTML = '<div class="card pad mute">Loading…</div>';
  const draw = async () => {
    const pr = await api(`/projects/${id}/progress`); if (!$('#tab') || !location.hash.startsWith('#/p/' + id)) return;
    const run = pr.running, busy = run || ['queued','running'].includes(pr.status);
    $('#pstatus').innerHTML = badge(pr.status, pr.status === 'imported' ? 'ready' : pr.status);
    const act = busy ? `<button onclick="ctl('pause')">Pause</button><button class="danger" onclick="ctl('cancel')">Cancel</button>`
      : `<button class="primary" onclick="ctl('process')">${pr.status === 'imported' ? 'Start processing' : pr.status === 'done' ? 'Run again (no-op if complete)' : 'Resume'}</button>
         ${pr.errors.length ? `<button onclick="ctl('process',{retry_failed:true})">Retry failed</button>` : ''}`;
    const stuck = !busy && pr.status !== 'imported';
    $('#tab').innerHTML = `
      <div class="card pad">
        <div class="row">${act}<span class="sp"></span><span class="mute small">${pr.tokens_in || pr.tokens_out ? `tokens in ${num(pr.tokens_in)} · out ${num(pr.tokens_out)} · model time ${dur(pr.seconds)}` : 'not started'}</span></div>
        ${pr.error ? `<div class="errbox">${esc(pr.error)}</div>` : ''}
        <table class="mt-s"><thead><tr><th>Stage</th><th style="width:30%">Progress</th><th>Tasks</th><th>Tokens in/out</th><th>Time</th></tr></thead><tbody>
        ${pr.stages.map(s => `<tr><td>${esc(s.label)}${pr.stage === s.stage && busy ? ' <span class="badge b-running">now</span>' : ''}</td>
          <td>${bar(s.total ? 100 * s.done / s.total : 0, s.failed ? 'fail' : '')}</td>
          <td class="small">${s.total ? `${s.done}/${s.total}${s.failed ? ` · <span class="err">${s.failed} failed</span>` : ''}` : '<span class="mute">—</span>'}</td>
          <td class="small">${s.total ? num(s.tokens_in) + ' / ' + num(s.tokens_out) : ''}</td><td class="small">${s.seconds ? dur(s.seconds) : ''}</td></tr>`).join('')}
        </tbody></table>
        ${pr.leads_remaining ? `<div class="row mt-s"><span class="mute small">${pr.leads_remaining} more story leads were found but not drafted (limit in Settings).</span><button class="small" ${busy?'disabled':''} onclick="expandLeads()">Draft 10 more</button></div>` : ''}
        ${stuck ? `<div class="row mt-s"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Reprocess from stage
          <select id="rs">${pr.stages.map(s => `<option value="${s.stage}">${esc(s.label)}</option>`).join('')}</select></label>
          <button class="small" onclick="reprocess()">Reprocess</button>
          <span class="mute small">Stories you already reviewed or edited are kept.</span></div>` : ''}
      </div>
      ${pr.errors.length ? `<div class="card pad mt"><h2>Errors</h2>${pr.errors.map(e => `<div class="mt-s"><b>${esc(e.stage)}</b> <span class="mute">${esc(e.key)}</span> · ${e.attempts} attempt${e.attempts>1?'s':''}
        <div class="err">${esc(e.error)}</div>
        <div class="row"><button class="small" ${busy?'disabled':''} onclick="retryTask(${e.id})">Retry this task</button>
        ${e.raw_failed.length ? `<button class="small" onclick="showRaw(${e.id})">View failed replies (${e.raw_failed.length})</button>` : ''}</div></div>`).join('')}</div>` : ''}`;
    return busy;
  };
  guard(async () => { await draw(); })();
  poll = setInterval(guard(async () => { await draw(); }), 2500);
}
const ctl = guard(async (what, body) => { await api(`/projects/${P.id}/${what}`, {method: 'POST', json: body || {}}); toast(what === 'process' ? 'Processing started' : what + ' requested'); P = await api('/projects/' + P.id); });
const retryTask = guard(async tid => { await api(`/projects/${P.id}/tasks/${tid}/retry`, {method: 'POST'}); await ctl('process'); });
const expandLeads = guard(async () => { const r = await api(`/projects/${P.id}/expand`, {method: 'POST', json: {count: 10}}); toast(`Queued ${r.queued} more`); });
const reprocess = guard(async () => { const st = $('#rs').value; if (!confirm(`Reprocess from "${st}"? Later stages are rebuilt; unreviewed stories are replaced.`)) return; await ctl('process', {from_stage: st}); });
const showRaw = guard(async tid => {
  const t = await api(`/projects/${P.id}/tasks/${tid}`);
  $('#overlay').innerHTML = `<div class="scrim" onclick="closeOverlay()"></div><div class="modal"><div class="card"><h2>Failed replies: ${esc(t.stage)} ${esc(t.key)}</h2>
    ${t.raw_failed.map((r, i) => `<h4>Attempt ${i + 1}: ${esc(r.error)}</h4><pre>${esc(r.response)}</pre>`).join('')}<div class="row"><span class="sp"></span><button onclick="closeOverlay()">Close</button></div></div></div>`;
});

/* stories tab */
const sf = {status: '', q: '', min: '', research: false, sort: 'priority'};
let selected = new Set();
async function tabStories(id) {
  selected = new Set();
  $('#tab').innerHTML = `
    <div class="row">
      <input id="sq" placeholder="Search stories" value="${esc(sf.q)}" style="flex:1;min-width:180px">
      <select id="sst"><option value="">All (excl. merged)</option>${['pending','approved','rejected'].map(s => `<option value="${s}" ${sf.status===s?'selected':''}>${s === 'pending' ? 'to review' : s}</option>`).join('')}</select>
      <select id="ssort">${[['priority','Priority'],['story','Story score'],['evidence','Evidence'],['title','Title'],['created','Order found']].map(([v,l]) => `<option value="${v}" ${sf.sort===v?'selected':''}>Sort: ${l}</option>`).join('')}</select>
      <label class="small"><input type="checkbox" id="sres" ${sf.research?'checked':''}> needs research</label>
      <input id="smin" type="number" min="0" max="100" placeholder="min priority" value="${esc(sf.min)}" style="width:110px">
    </div>
    <div class="row mt-s"><button id="merge-btn" disabled onclick="mergeSelected()">Merge selected</button>
      <button class="small" onclick="rescore()">Re-score with current weights</button><span class="sp"></span>

  const k = $('#s-key').value; if (k) patch.api_key = k;
  const s = await api('/settings', {method: 'PUT', json: patch}); showDerived(s); toast('Settings saved');
});
const testConn = guard(async () => {
  await saveSettings(); $('#conn').innerHTML = '<span class="mute">Testing…</span>';
  const r = await api('/llm/test', {method: 'POST'});
  $('#conn').innerHTML = r.ok ? `<div class="ok">✓ Connected to ${esc(r.model)} (${r.latency_s}s). ${r.model_listed === false ? '<span style="color:var(--warn)">Model id not in the server model list.</span>' : ''}
    ${r.note ? `<div class="small mute">${esc(r.note)}</div>` : ''}${r.json_mode_supported ? '<div class="small">JSON mode supported — you can switch it on above.</div>' : ''}</div>` : `<div class="errbox">${esc(r.error || 'Connection failed')}</div>`;
  if (r.models) $('#models').innerHTML = r.models.filter(m => m.type === 'text' || !m.type).map(m => `<option value="${esc(m.id)}">${esc(m.state)}</option>`).join('');
});

route();
</script>
</body>
</html>
